# ---------------------------------------------------------------------------
# LIVE AS OF 2026-08-11, on a PUBLIC repository.
#
# The repository is at github.com/HetCreep/SpriteDesignDatum and this workflow runs on
# every push and pull request. The result is public, so a green tick here is a signal to
# a reader and not only a note to the owner.
#
# Two earlier revisions of this header were wrong in opposite directions: the first said
# the repository had no remote and had never run, which stopped being true the moment it
# was pushed; the second was left with a half-sentence during the repair. Both are
# recorded rather than quietly overwritten, because a header describing the wrong world
# is the exact defect this repository exists to catch.
#
# Everything it does works right now, locally, with node alone and no install:
#
#     node tools/check.mjs
#
# If this repository is ever published, pin the two actions below to commit SHAs rather
# than tags. A tag is mutable and this workflow has repository read access.
# ---------------------------------------------------------------------------

name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm install and no package.json: the checker has no dependencies. It does
      # shell out to `npx prettier@3`, which pulls prettier from the npm registry on
      # first use, so this job needs network. If prettier cannot run, the checker
      # reports that as a failure rather than as a pass.
      - run: node tools/check.mjs
